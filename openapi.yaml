openapi: 3.0.3
info:
  title: Books API
  version: 2.0.0
  description: |
    REST API for managing books.

    ## Versioning

    **Supported versions: v1, v2. Default: v1** (fixed — it never auto-jumps to the newest version).

    Pick a version with any of three interchangeable strategies:

    1. **URL path** (recommended — explicit and cacheable):
       `GET /api/v1/books`, `GET /api/v2/books`.
       The version in the path is authoritative; version headers are ignored here.
    2. **`X-API-Version` header** on the version-neutral path:
       `GET /api/books` + `X-API-Version: 2`.
    3. **`Accept` content negotiation** on the neutral path:
       `GET /api/books` + `Accept: application/vnd.api+json;version=2`.

    **Resolution priority on the neutral path:** `X-API-Version` → `Accept;version` → default (v1).
    An unknown version via header/`Accept` falls back to the default; an unknown version in the
    URL (e.g. `/api/v99/...`) is `404`.

    > Swagger UI documents the explicit `/api/vN/...` paths. The version-neutral `/api/...` path
    > with header/`Accept` selection behaves identically — see the migration guide.

    ## Deprecation

    **v1 is deprecated (sunset: 2026-12-31).** Every v1 response carries RFC 8594 headers:
    `Deprecation: true`, `Sunset: <http-date>`, and `Link: </docs/migration-v1-to-v2>; rel="deprecation"`.

    ## What changed in v2

    v2 changes the **book response representation only** (request bodies are unchanged):
    `title` is renamed to `name`, and `author` becomes a nested object.
    Authentication is version-neutral and lives at `/api/auth` and `/api/refresh` (no version prefix).

servers:
  - url: http://localhost

tags:
  - name: Auth
    description: Version-neutral authentication endpoints (the token is the same across versions).
  - name: Books v1
    description: Book operations — DEPRECATED (sunset 2026-12-31). All v1 responses include Deprecation/Sunset/Link headers.
  - name: Books v2
    description: Book operations — current representation (`name` field, nested `author`).
  - name: Docs
    description: Human-readable documentation endpoints.

paths:
  /api/auth:
    post:
      tags: [Auth]
      summary: Get access and refresh tokens (version-neutral)
      description: Authenticate using client credentials to receive a JWT token pair. Not versioned — the same token works across all API versions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ client_id, client_secret ]
              properties:
                client_id:
                  type: string
                  format: uuid
                  example: "72f70134-06a2-4847-bc45-f8555cd354b9"
                client_secret:
                  type: string
                  example: "supersecretstring"
      responses:
        "200":
          description: Token pair issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  client_id:
                    type: string
                    format: uuid
                  issued:
                    type: integer
                    description: Unix timestamp of token issue time
                  expires:
                    type: integer
                    description: Unix timestamp of access token expiration (issued + 900)
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token (version-neutral)
      description: Exchange a valid refresh token for a new token pair. Old refresh token is revoked (token rotation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ refresh_token, client_id ]
              properties:
                refresh_token:
                  type: string
                client_id:
                  type: string
                  format: uuid
                  example: "72f70134-06a2-4847-bc45-f8555cd354b9"
      responses:
        "200":
          description: New token pair issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string

  /api/v1/books:
    get:
      tags: [Books v1]
      deprecated: true
      summary: List books (v1)
      description: Returns a paginated list of books in the v1 representation.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/AuthorFilter'
        - $ref: '#/components/parameters/TitleFilter'
      responses:
        "200":
          description: Paginated list
          headers:
            Link:
              description: RFC 5988 pagination links plus an RFC 8594 `rel="deprecation"` link to the migration guide.
              schema:
                type: string
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        "422":
          $ref: '#/components/responses/ValidationError'

    post:
      tags: [Books v1]
      deprecated: true
      summary: Create book (v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of created resource
              schema:
                type: string
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        "422":
          $ref: '#/components/responses/ValidationError'

  /api/v1/books/{id}:
    get:
      tags: [Books v1]
      deprecated: true
      summary: Get book by ID (v1)
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        "200":
          description: Book found
          headers:
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Link:
              $ref: '#/components/headers/DeprecationLink'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Books v1]
      deprecated: true
      summary: Replace book (v1)
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationError'

    patch:
      tags: [Books v1]
      deprecated: true
      summary: Partially update book (v1)
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookPatch'
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Books v1]
      deprecated: true
      summary: Delete book (v1)
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        "204":
          description: Deleted successfully
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v2/books:
    get:
      tags: [Books v2]
      summary: List books (v2)
      description: |
        Returns a paginated list of books in the **v2 representation**
        (`title` → `name`, `author` as a nested object). Request parameters are
        identical to v1.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/AuthorFilter'
        - $ref: '#/components/parameters/TitleFilter'
      responses:
        "200":
          description: Paginated list
          headers:
            Link:
              description: RFC 5988 pagination links
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookV2'
        "422":
          $ref: '#/components/responses/ValidationError'

    post:
      tags: [Books v2]
      summary: Create book (v2)
      description: Request body is unchanged from v1 (`title`, `author`, `description`); only the read representation differs between versions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of created resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        "422":
          $ref: '#/components/responses/ValidationError'

  /api/v2/books/{id}:
    get:
      tags: [Books v2]
      summary: Get book by ID (v2)
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        "200":
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookV2'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Books v2]
      summary: Replace book (v2)
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationError'

    patch:
      tags: [Books v2]
      summary: Partially update book (v2)
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookPatch'
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Books v2]
      summary: Delete book (v2)
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        "204":
          description: Deleted successfully
        "404":
          $ref: '#/components/responses/NotFound'

  /docs/migration-v1-to-v2:
    get:
      tags: [Docs]
      summary: API migration guide (v1 → v2)
      description: Returns the human-readable migration guide as Markdown. This is the target of the `Link` deprecation header on v1 responses.
      responses:
        "200":
          description: Migration guide
          content:
            text/markdown:
              schema:
                type: string
        "404":
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    BookId:
      in: path
      name: id
      required: true
      schema:
        type: integer
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Sort:
      in: query
      name: sort
      schema:
        type: string
        enum: [id, title, author, description, created_at]
    OrderBy:
      in: query
      name: orderBy
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    AuthorFilter:
      in: query
      name: author
      schema:
        type: string
    TitleFilter:
      in: query
      name: title
      schema:
        type: string

  headers:
    Deprecation:
      description: RFC 8594 — present on every v1 response.
      schema:
        type: string
        example: "true"
    Sunset:
      description: RFC 8594 — HTTP-date after which v1 may stop working.
      schema:
        type: string
        example: "Thu, 31 Dec 2026 00:00:00 GMT"
    DeprecationLink:
      description: RFC 8288 link to the migration guide (host-relative).
      schema:
        type: string
        example: '</docs/migration-v1-to-v2>; rel="deprecation"'

  schemas:
    Book:
      type: object
      description: v1 representation.
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        description:
          type: string
        links:
          type: object
          properties:
            self:
              type: string
            update:
              type: string
            delete:
              type: string
            author:
              type: string
      required: [id, title, author, description]

    BookV2:
      type: object
      description: |
        v2 representation. Breaking changes vs v1: `title` is renamed to `name`,
        and `author` is a nested object instead of a flat string.
      properties:
        id:
          type: integer
        name:
          type: string
        author:
          type: object
          properties:
            name:
              type: string
          required: [name]
        description:
          type: string
      required: [id, name, author, description]

    BookCreate:
      type: object
      required: [title, author, description]
      properties:
        title:
          type: string
        author:
          type: string
        description:
          type: string

    BookPatch:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        description:
          type: string

    IdResponse:
      type: object
      properties:
        id:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
        errors:
          type: object

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
